[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
# E402 (import not at top) is intentional in the test modules, which must insert
# src/ and data/ onto sys.path before importing the code under test. Ignored
# project-wide because the source modules contain no such imports.
ignore = ["E402"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
files = ["src", "data"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pandas.*", "scipy.*", "sklearn.*", "matplotlib.*"]
ignore_missing_imports = true
