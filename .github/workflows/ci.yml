name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    name: Test and smoke workflow on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check source files compile
        run: |
          python -m compileall data src tests

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Generate synthetic dataset
        run: |
          python data/generate_ratings.py --users 200 --movies 300 --seed 42 --outdir data

      - name: Run recommender workflow
        run: |
          python src/build_recommender.py --ratings data/ratings.csv --movies data/movies.csv --outdir outputs --k 10 --alpha 0.6 --seed 42

      - name: Verify expected outputs
        run: |
          test -f outputs/metrics.json
          test -f outputs/ratings_hist.png
          test -f outputs/top_movies.png
          test -f outputs/recs_user_1.txt
          test -f outputs/recs_user_2.txt
          test -f outputs/recs_user_3.txt

      - name: Validate metrics JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("outputs/metrics.json")
          data = json.loads(path.read_text())

          for key in ["collaborative", "content", "hybrid"]:
              if key not in data:
                  raise AssertionError(f"Missing model metrics: {key}")
              for metric in ["precision", "recall", "ndcg"]:
                  value = data[key][metric]
                  if not 0 <= value <= 1:
                      raise AssertionError(f"{key}.{metric} must be between 0 and 1, got {value}")

          print("metrics.json OK")
          PY

      - name: Upload generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: movie-recommendation-outputs-python-${{ matrix.python-version }}
          path: outputs/
